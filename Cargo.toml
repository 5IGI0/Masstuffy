[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
thiserror = "2.0.21"
masstuffy-collection = { path = "crates/collection", version = "0.1.0" }
masstuffy-dictstore = { path = "crates/dictstore", version = "0.1.0" }
masstuffy-durable = { path = "crates/durable", version = "0.1.0" }
masstuffy-zframe = { path = "crates/zframe", version = "0.1.0", default-features = false }
masstuffy-cdx = { path = "crates/cdx", version = "0.1.0" }
masstuffy-seglog = { path = "crates/seglog", version = "0.1.0" }
masstuffy-urlkey = { path = "crates/urlkey", version = "0.1.0" }
masstuffy-index = { path = "crates/index", version = "0.1.0" }
masstuffy-index-redb = { path = "crates/index-redb", version = "0.1.0" }
masstuffy-warc = { path = "crates/warc", version = "0.1.0", default-features = false }
redb = { version = "4.6.0", default-features = false, features = ["std"] }
xxhash-rust = { version = "0.8.16", default-features = false, features = ["xxh3"] }
zstd = { version = "0.14.4", default-features = false }
url = { version = "2.5.8", default-features = false, features = ["std"] }
serde = { version = "1.0.228", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.150", default-features = false, features = ["std"] }
tokio = { version = "1.52.3", default-features = false }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
uuid = { version = "1.29.2", default-features = false, features = ["std", "v4"] }

# Line tables keep file:line in backtraces while cutting debug build size several times.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package.redb]
opt-level = 2

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
cast_possible_truncation = "deny"

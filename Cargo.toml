[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
thiserror = "2.0.21"
zstd = { version = "0.14.4", default-features = false }
url = { version = "2.5.8", default-features = false, features = ["std"] }
uuid = { version = "1.29.2", default-features = false, features = ["std", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
cast_possible_truncation = "deny"

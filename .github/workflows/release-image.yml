# On every push to the `release` branch (a merge into `release` is a push): builds the
# masstuffy-server image, pushes it to ghcr.io, then tags the commit `v<version>` and creates a
# GitHub release whose notes are the `## [<version>]` section of CHANGELOG.md.
name: Release image

on:
  push:
    branches: [release]

permissions:
  contents: write # push the git tag and create the GitHub release
  packages: write

concurrency:
  group: release-image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image version is the masstuffy-http crate version (what `masstuffy-server --version`
      # prints). A published version is never overwritten: bump it before merging into release.
      # Everything is checked before building so a bad release fails without publishing anything.
      - id: version
        run: |
          v=$(awk -F'"' '/^\[/{p=($0=="[package]")} p && /^version *=/{print $2; exit}' crates/http/Cargo.toml)
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::unexpected version in crates/http/Cargo.toml: '$v'"; exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if docker manifest inspect "$image:$v" >/dev/null 2>&1; then
            echo "::error::$image:$v already exists; bump the version in crates/http/Cargo.toml"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            echo "::error::git tag v$v already exists; bump the version in crates/http/Cargo.toml"; exit 1
          fi
          if ! scripts/changelog-section.sh "$v" > "$RUNNER_TEMP/release-notes.md"; then
            echo "::error::CHANGELOG.md has no '## [$v]' section; add one before merging into release"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "minor=${v%.*}" >> "$GITHUB_OUTPUT"

      # Image name is lower-cased by the action (ghcr.io/5igi0/masstuffy).
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.minor }}
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Tag only after the image is published. `gh release create` creates the tag on the exact
      # commit that was built. Tags pushed with GITHUB_TOKEN do not trigger other workflows.
      - name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
